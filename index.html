<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102c35"><title>Innebandy Coach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102c35;color:white;font:15px system-ui,-apple-system,sans-serif}header{padding:13px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}small{color:#b8cbd0}.panel{background:#193d47;padding:10px;display:flex;gap:7px;overflow-x:auto}button{border:1px solid #54717a;background:#244c57;color:white;border-radius:10px;padding:10px 12px;white-space:nowrap;font-weight:600}button.active{background:#f5c65b;color:#122e38}button:active{opacity:.7}main{padding:8px}#court{width:100%;aspect-ratio:20/35;max-height:65vh;display:block;background:#e5bb80;border-radius:12px;touch-action:none;box-shadow:0 5px 20px #071b23}#court.landscape{aspect-ratio:35/20;max-height:52vh}.actions{display:flex;flex-wrap:wrap;gap:7px;padding:10px 0}.actions button{flex:1}input{border-radius:8px;padding:10px;background:#fff;color:#111;border:0;width:100%}.hint{color:#c1d0d3;font-size:13px;margin:8px 2px 15px}#saved{display:flex;flex-direction:column;gap:7px;padding:0 10px 20px}.savedrow{display:flex;align-items:center;gap:8px}.savedrow button:first-child{flex:1;text-align:left}#status{font-size:12px;color:#c6d7dc}</style></head>
<body><header><div><h1>🏑 Innebandy Coach</h1><small>Din digitala taktiktavla</small></div><span id="status">Redo</span></header>
<div class="panel" id="tools">
<button data-tool="select" class="active">☝️ Flytta</button><button data-tool="home">🔵 Spelare</button><button data-tool="away">🔴 Motståndare</button><button data-tool="goalie">🥅 Målvakt</button><button data-tool="ball">⚪ Boll</button><button data-tool="cone">🔺 Kona</button><button data-tool="goal">🥅 Mål</button><button data-tool="draw">✏️ Rita</button><button data-tool="arrow">↗️ Pil</button><button data-tool="erase">🧽 Radera</button></div>
<main><svg id="court" viewBox="0 0 400 700" aria-label="Interaktiv innebandyplan"><g id="floor"></g><g id="drawings"></g><g id="pieces"></g><g id="draft"></g></svg>
<div class="actions"><button id="rotate">↔️ Vänd plan</button><button id="undo">↶ Ångra</button><button id="clear">🗑️ Rensa</button><button id="save">💾 Spara övning</button></div><input id="name" placeholder="Namn på övningen" maxlength="70"><p class="hint">Välj ett föremål och tryck på planen för att placera det. Välj Flytta och dra föremålen med fingret. Rita och Pil fungerar också med fingret. Allt sparas lokalt på telefonen.</p><h3>Sparade övningar</h3></main><div id="saved"></div>
<script>
(()=>{'use strict';
const svg=document.querySelector('#court'),floor=document.querySelector('#floor'),piecesEl=document.querySelector('#pieces'),drawEl=document.querySelector('#drawings'),draft=document.querySelector('#draft'),status=document.querySelector('#status');
let tool='select',items=[],lines=[],history=[],gesture=null,wide=false;
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){let n=document.createElementNS(NS,tag);for(let k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n}
function snapshot(){history.push(JSON.stringify({items,lines}));if(history.length>60)history.shift()}
function coords(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let m=svg.getScreenCTM();if(!m)return{x:200,y:350};let v=p.matrixTransform(m.inverse());return{x:Math.max(8,Math.min(392,v.x)),y:Math.max(8,Math.min(692,v.y))}}
function court(){floor.replaceChildren();el('rect',{x:10,y:10,width:380,height:680,rx:38,fill:'#e8bf87',stroke:'#fff', 'stroke-width':5},floor);el('path',{d:'M10 350H390',stroke:'#fff','stroke-width':3},floor);el('circle',{cx:200,cy:350,r:58,fill:'none',stroke:'#fff','stroke-width':3},floor);[90,610].forEach(y=>{el('rect',{x:115,y:y-57,width:170,height:114,rx:35,fill:'none',stroke:'#fff','stroke-width':3},floor);el('rect',{x:165,y:y-22,width:70,height:44,fill:'none',stroke:'#fff','stroke-width':2},floor)});[90,610].forEach(y=>el('circle',{cx:200,cy:y,r:4,fill:'#fff'},floor));}
function piece(o){let g=el('g',{transform:'translate('+o.x+' '+o.y+')','data-id':o.id},piecesEl);if(o.type==='home'||o.type==='away'||o.type==='goalie'){let c=o.type==='home'?'#2178df':o.type==='away'?'#df4946':'#e9b53c';el('circle',{r:15,fill:c,stroke:'#fff','stroke-width':2.5},g);let t=el('text',{x:0,y:5,'font-size':o.type==='goalie'?11:13,'text-anchor':'middle','font-weight':700,fill:'#fff','pointer-events':'none'},g);t.textContent=o.type==='goalie'?'MV':o.num||'';}else if(o.type==='ball'){el('circle',{r:7,fill:'#fff',stroke:'#333','stroke-width':2},g)}else if(o.type==='cone'){el('path',{d:'M0 -14L13 11H-13Z',fill:'#ff8029',stroke:'#fff','stroke-width':2},g)}else if(o.type==='goal'){el('rect',{x:-27,y:-10,width:54,height:20,rx:3,fill:'#dce8ea','fill-opacity':.6,stroke:'#d12e38','stroke-width':4},g);el('path',{d:'M-20 -8V8M-10 -8V8M0 -8V8M10 -8V8M20 -8V8',stroke:'#9eabb0','stroke-width':1},g)}}
function render(){piecesEl.replaceChildren();drawEl.replaceChildren();items.forEach(piece);lines.forEach(l=>{if(l.pts.length<2)return;let d=l.pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');el('path',{d,fill:'none',stroke:l.arrow?'#e54436':'#143b6c','stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'},drawEl);if(l.arrow){let a=l.pts[l.pts.length-2],b=l.pts.at(-1),ang=Math.atan2(b.y-a.y,b.x-a.x),sz=14;el('path',{d:'M'+(b.x-sz*Math.cos(ang-.55))+' '+(b.y-sz*Math.sin(ang-.55))+'L'+b.x+' '+b.y+'L'+(b.x-sz*Math.cos(ang+.55))+' '+(b.y-sz*Math.sin(ang+.55)),fill:'none',stroke:'#e54436','stroke-width':4},drawEl)}})}
function persist(){try{localStorage.setItem('ib-current',JSON.stringify({items,lines}))}catch(e){}}
function redraw(){render();persist()}
function closest(p){let best=null,dist=30;for(let i=items.length-1;i>=0;i--){let o=items[i],d=Math.hypot(o.x-p.x,o.y-p.y);if(d<dist){best=o;dist=d}}return best}
function start(e){e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}let p=coords(e);if(tool==='home'||tool==='away'||tool==='goalie'||tool==='ball'||tool==='cone'||tool==='goal'){snapshot();let n=items.filter(x=>x.type===tool).length+1;items.push({id:Date.now()+'-'+Math.random(),type:tool,x:p.x,y:p.y,num:n});redraw();return}if(tool==='erase'){let o=closest(p);if(o){snapshot();items=items.filter(x=>x!==o);redraw()}else if(lines.length){snapshot();lines.pop();redraw()}return}if(tool==='select'){let o=closest(p);if(o){snapshot();gesture={kind:'move',id:o.id,dx:o.x-p.x,dy:o.y-p.y};}return}if(tool==='draw'||tool==='arrow'){snapshot();gesture={kind:tool,pts:[p]};}}
function move(e){if(!gesture)return;e.preventDefault();let p=coords(e);if(gesture.kind==='move'){let o=items.find(x=>x.id===gesture.id);if(o){o.x=Math.max(15,Math.min(385,p.x+gesture.dx));o.y=Math.max(15,Math.min(685,p.y+gesture.dy));render()}}else{if(gesture.kind==='draw')gesture.pts.push(p);else gesture.pts=[gesture.pts[0],p];draft.replaceChildren();let pts=gesture.pts;el('polyline',{points:pts.map(x=>x.x+','+x.y).join(' '),fill:'none',stroke:'#183c75','stroke-width':4,'stroke-linecap':'round'},draft)}}
function end(){if(!gesture)return;if(gesture.kind==='draw'||gesture.kind==='arrow'){if(gesture.pts.length>1)lines.push({pts:gesture.pts,arrow:gesture.kind==='arrow'})}gesture=null;draft.replaceChildren();redraw()}
svg.addEventListener('pointerdown',start);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));status.textContent=b.textContent.trim()});
document.querySelector('#undo').onclick=()=>{if(!history.length)return;let s=JSON.parse(history.pop());items=s.items;lines=s.lines;redraw()};
document.querySelector('#clear').onclick=()=>{if(!confirm('Rensa hela taktiktavlan?'))return;snapshot();items=[];lines=[];redraw()};
document.querySelector('#rotate').onclick=()=>{wide=!wide;svg.classList.toggle('landscape',wide);svg.setAttribute('viewBox',wide?'0 0 700 400':'0 0 400 700');floor.setAttribute('transform',wide?'translate(700 0) rotate(90)':'');piecesEl.setAttribute('transform',wide?'translate(700 0) rotate(90)':'');drawEl.setAttribute('transform',wide?'translate(700 0) rotate(90)':'');draft.setAttribute('transform',wide?'translate(700 0) rotate(90)':'');status.textContent=wide?'Liggande':'Stående'};
function saved(){try{return JSON.parse(localStorage.getItem('ib-saved')||'[]')}catch(e){return[]}}
function showSaved(){let wrap=document.querySelector('#saved');wrap.replaceChildren();saved().forEach((s,i)=>{let r=document.createElement('div');r.className='savedrow';let b=document.createElement('button');b.textContent='📋 '+s.name;b.onclick=()=>{snapshot();items=structuredClone(s.items);lines=structuredClone(s.lines);document.querySelector('#name').value=s.name;redraw()};let d=document.createElement('button');d.textContent='✕';d.setAttribute('aria-label','Ta bort '+s.name);d.onclick=()=>{if(confirm('Ta bort övningen?')){let a=saved();a.splice(i,1);localStorage.setItem('ib-saved',JSON.stringify(a));showSaved()}};r.append(b,d);wrap.append(r)})}
document.querySelector('#save').onclick=()=>{let name=document.querySelector('#name').value.trim()||'Övning '+new Date().toLocaleDateString('sv-SE');let a=saved();a.unshift({name,items:structuredClone(items),lines:structuredClone(lines)});try{localStorage.setItem('ib-saved',JSON.stringify(a));status.textContent='Sparad ✓';showSaved()}catch(e){alert('Kunde inte spara övningen')}};
try{let s=JSON.parse(localStorage.getItem('ib-current')||'{}');items=s.items||[];lines=s.lines||[]}catch(e){}
court();render();showSaved();
})();
</script></body></html>
